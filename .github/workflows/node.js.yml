# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [ 24 ]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v5
    - name: Use Node.js ${{ matrix.node }}
      uses: actions/setup-node@v5
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
    - run: npm ci
    - run: npm run test:unit
    - run: npm run lint:check
    - run: npm run build --if-present
    - name: Verify Nissan endpoint delivery
      run: |
        cmp public/modules/vehicles/nissanconnect/test_connection.php dist/modules/vehicles/nissanconnect/test_connection.php
        cmp public/modules/vehicles/nissanconnect/connection_test_lib.php dist/modules/vehicles/nissanconnect/connection_test_lib.php

  nissan-php-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check PHP runtime and endpoint syntax
      run: |
        php -n -v
        php -n -l public/modules/vehicles/nissanconnect/test_connection.php
        php -n -l public/modules/vehicles/nissanconnect/connection_test_lib.php
    - name: Run synthetic endpoint tests
      run: |
        python3 -m venv /tmp/nissan-test-venv
        /tmp/nissan-test-venv/bin/python -m pip install pytest==8.3.5
        /tmp/nissan-test-venv/bin/python -m pytest -q tests/nissanconnect
